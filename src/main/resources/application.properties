spring.application.name=cleanArch-app

spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/evento_db
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Se estiver usando Spring Boot 3.2+, o dialect é opcional e detectado sozinho.
# Se quiser fixar explicitamente para Postgres, utilize:
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.format-sql=true